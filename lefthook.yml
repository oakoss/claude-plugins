output:
  - failure
  - execution_out

# `pnpm install` installs these hooks: the lefthook npm package runs
# `lefthook install -f` from its own postinstall (skipped when CI is set, where
# git hooks are not wanted anyway). No `prepare` or `setup` script re-does it.

# Beads commands invoke .beads/hooks/* directly rather than a local wrapper.
# Those shims are generated by beads (they carry a `v1.2.2` marker), are
# self-contained, and already handle a missing `bd`, the BEADS_HOOK_TIMEOUT
# watchdog with its perl fallback, exit 124/142 for a timeout, and exit 3 for
# an uninitialized database. Copying that logic locally would mean maintaining
# a second copy that drifts when beads updates its own.
#
# `core.hooksPath` must stay unset. Both `bd init` and `bd hooks install
# --beads` set it to .beads/hooks, which makes git bypass lefthook entirely
# and silently — no commitlint, no formatters. Use `bd bootstrap`, and if a
# beads command sets it anyway, unset it.

pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: '*.{sh,bash}'
      run: shellcheck --external-sources --severity=warning {staged_files}
    lint-md:
      glob: '*.md'
      run: pnpm exec markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    format-scripts:
      glob: 'scripts/*.{mjs,js,cjs}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/pre-commit

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

prepare-commit-msg:
  commands:
    beads:
      env:
        TERM: dumb
      # Only {1} is passed. Git omits the source and sha arguments on a plain
      # commit, and lefthook substitutes an unfilled positional as the literal
      # text "{2}" rather than dropping it — which beads would then read as
      # git's source argument.
      run: .beads/hooks/prepare-commit-msg {1}

post-merge:
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/post-merge {1}

post-checkout:
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/post-checkout {1} {2} {3}

pre-push:
  parallel: true
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/pre-push {1} {2}
