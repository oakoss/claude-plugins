output:
  - failure
  - execution_out

# `pnpm install` installs these hooks: the lefthook npm package runs
# `lefthook install -f` from its own postinstall (skipped when CI is set, where
# git hooks are not wanted anyway). No `prepare` or `setup` script re-does it.
#
# `core.hooksPath` must stay unset: a tool that sets it makes git bypass
# lefthook silently, with no commitlint and no formatters.

pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: '*.{sh,bash}'
      run: shellcheck --external-sources --severity=warning {staged_files}
    lint-md:
      glob: '*.md'
      run: pnpm exec markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm typecheck
    oxlint:
      glob: '*.{ts,tsx,js,cjs,mjs}'
      exclude: ['types/**', '**/types/**']
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      glob: '*.{ts,tsx,js,cjs,mjs,json}'
      exclude: ['types/**']
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
