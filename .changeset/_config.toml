#:schema ./_schema.json
change-files = true
conventional-commits = true

# A major change file maps to a minor bump below 1.0.0, so reaching 1.0.0 is a
# deliberate act rather than a side effect of one bump file. This is oakum's
# default.
versioning = "zero-major"

commit-message = "chore(release): version packages"

# Matches the existing tags. oakum's default renders `<name>/v<version>`, and
# its first release refuses on the mismatch against `<name>@<version>`.
tag-format = "{{ package }}@{{ version }}"

# Changelog rendering stays on oakum's default, which adds no PR links.
# Decided, not overlooked.

# Every plugin is `private: true` — the package.json files are version anchors,
# not registry packages. Without both axes oakum plans and tags nothing.
[private-packages]
version = true
tag = true

# The version anchor is package.json; these are the manifests that must move
# with it.
[[packages.review-cycle.extra-files]]
path = ".claude-plugin/plugin.json"
format = "json"
key = "version"

[[packages.review-cycle.extra-files]]
path = "/.claude-plugin/marketplace.json"
format = "json"
key = "plugins.{name=review-cycle}.version"

[[packages.pr-kit.extra-files]]
path = ".claude-plugin/plugin.json"
format = "json"
key = "version"

[[packages.pr-kit.extra-files]]
path = "/.claude-plugin/marketplace.json"
format = "json"
key = "plugins.{name=pr-kit}.version"

[[packages.pr-watch.extra-files]]
path = ".claude-plugin/plugin.json"
format = "json"
key = "version"

[[packages.pr-watch.extra-files]]
path = "/.claude-plugin/marketplace.json"
format = "json"
key = "plugins.{name=pr-watch}.version"

[[packages.session.extra-files]]
path = ".claude-plugin/plugin.json"
format = "json"
key = "version"

[[packages.session.extra-files]]
path = "/.claude-plugin/marketplace.json"
format = "json"
key = "plugins.{name=session}.version"
