packages:
  - "plugins/*"

allowBuilds:
  '@oakoss/oakum': true
  lefthook: true

# Temporary: pnpm wrote this because oakum 0.3.1 was published inside the
# release-age window. Measured load-bearing — without it `pnpm install
# --frozen-lockfile` fails ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION, in the five
# places CI runs it. Remove it once the window passes: left in place it is a
# standing exemption, and it needs hand-editing at every oakum bump.
minimumReleaseAgeExclude:
  - '@oakoss/oakum@0.3.1'

patchedDependencies:
  "@varlock/bumpy@1.18.1": patches/@varlock__bumpy@1.18.1.patch
