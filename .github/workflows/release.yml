name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# oakum derives each command's precondition when it runs, so nothing computed
# in one job can go stale in another and a dropped run is recovered by the push
# behind it. The group is here to serialize overlapping pushes anyway: two
# `release` runs can both read the same version as untagged before either
# pushes, and oakum's tag-collision refusal is the only thing between that and
# a wrong release. Cancelling is off — a cancelled release can leave some of
# the three tags pushed. By default GitHub also cancels a run still pending in
# the group when a newer one queues; `queue: max` keeps every pending run, so
# each push is released from its own commit rather than by a later one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # Runs in parallel with `release`, not before it: there is no plan step to
  # gate on. This job acts only when bump files are pending, `release` only when
  # a manifest version is untagged, and the two are never true of one push.
  version-pr:
    name: Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Short-lived installation token from the oakoss GitHub App. PRs and
      # pushes made with it trigger CI, which the default github.token's don't
      # by GitHub's anti-recursion guard, and there is no PAT to expire.
      #
      # `$/` resolves to this repository at the running commit and needs no
      # checkout, unlike `./`. Requires runner >= 2.336.0; ours reports 2.337.0.
      - name: Mint app token
        id: app-token
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins

      # Nothing is pushed from this job — oakum writes the version PR through
      # the GitHub API — so the default credential is sufficient here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # One pass writes package.json, the changelog, and the declared
      # extra-files (each plugin.json plus its marketplace.json entry), so the
      # PR already carries the full release shape the bump gate expects.
      - name: Create or update version PR
        run: pnpm exec oakum ci version-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # "Release" here is tags and GitHub releases only. Every package is private,
  # nothing goes to a registry, and no publish credentials exist in this repo.
  release:
    name: Tag release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Mint app token
        id: app-token
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins
          resolve-identity: true

      # Persists the app credential, because the tag push is a plain `git push`
      # that uses whatever the checkout left behind — oakum's own token only
      # reaches the GitHub API. fetch-depth: 0 is required, not tidiness: oakum
      # reads full tag history to decide which manifest versions are untagged,
      # and refuses rather than guesses when it cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # The annotated tag's tagger comes from git config, not from the API
      # token, so attribution needs this as well as the token below. Resolved
      # from the app at run time rather than hardcoded, so it cannot drift from
      # whichever app minted the token.
      - name: Set the bot commit identity
        env:
          BOT_USER: ${{ steps.app-token.outputs.user }}
          BOT_EMAIL: ${{ steps.app-token.outputs.email }}
        run: |
          git config user.name "$BOT_USER"
          git config user.email "$BOT_EMAIL"

      # Tags, pushes, and creates a published GitHub release per package, one
      # package at a time. A failure part-way leaves the finished tags in place
      # and reports which stage each reached; re-running resumes rather than
      # colliding, because an existing tag is picked up as a resume candidate.
      - name: Tag and create releases
        run: pnpm exec oakum release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
