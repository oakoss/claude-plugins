name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detects whether this push should update the version PR, publish (tag), or
  # do nothing. Read-only; no credentials beyond the default token.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: plan
        name: Detect release mode
        run: pnpm exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  # Creates or updates the version PR, then pushes the plugin.json /
  # marketplace.json sync into its branch — bumpy only versions package.json
  # and CHANGELOG; the sync script propagates to the plugin manifests so the
  # PR carries the full release shape the version-bump gate and the CI drift
  # check both expect.
  version-pr:
    name: Version PR
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Short-lived installation token from the oakoss GitHub App. PRs and
      # pushes made with it trigger CI (the default github.token's don't, by
      # GitHub's anti-recursion guard), and there is no PAT to expire.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update version PR
        run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Fold the synced manifests into bumpy's own commit: amend and
      # force-push, which is safe because bumpy force-recreates this branch on
      # every run. The version PR ends up with a single oakoss[bot] commit and
      # one CI cycle on the surviving head. The push rides the checkout's
      # app-token credential, so CI still triggers.
      - name: Sync manifests and normalize the changelog in the version PR
        run: |
          git fetch origin bumpy/version-packages
          git checkout bumpy/version-packages
          node scripts/sync-plugin-versions.mjs
          # bumpy writes the version heading and its <sub> date on adjacent
          # lines, which trips MD022 in the Markdown job and fails the whole
          # version PR. Normalizing before the diff check folds the fix into
          # the same amend.
          #
          # The status is deferred rather than allowed to abort the step:
          # --fix still exits nonzero on anything it cannot repair, and this
          # body runs under bash -e, so a stray unfixable rule would skip the
          # manifest sync entirely. The version PR would then fail Version
          # consistency with the real cause buried in this job's log.
          lint=0
          pnpm exec markdownlint-cli2 --fix "plugins/*/CHANGELOG.md" || lint=$?
          if ! git diff --quiet; then
            git config user.name "oakoss[bot]"
            git config user.email "oakoss[bot]@users.noreply.github.com"
            git commit -a --amend --no-edit
            git push --force-with-lease origin bumpy/version-packages
          fi
          exit "$lint"

  # "Publish" for this repo is tags only — every package is private, so bumpy
  # creates git tags and GitHub releases; nothing goes to npm and no publish
  # credentials exist here.
  publish:
    name: Tag release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Tag and create releases
        run: pnpm exec bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # bumpy files private packages under `skipped` rather than `published`,
      # so it never calls `finalizeRelease` (the release stays a draft) and
      # never runs its tag push (gated on `published.length > 0`). Publishing
      # the draft does both. It also only warns when creating a release fails,
      # so a package this commit released that has no release at all is a
      # silent miss rather than one that has never shipped.
      #
      # Ownership comes from the versions in the tree, since bumpy tags
      # `<name>@<version>`. Every other draft is left alone: publishing one
      # would create its tag and make it public.
      - name: Publish the releases bumpy left as drafts
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          err=$(mktemp)
          trap 'rm -f "$err"' EXIT
          released=$(git show --name-only --format= HEAD \
            | grep -E '^plugins/[^/]+/package\.json$' || true)
          rc=0
          seen=0
          for manifest in plugins/*/package.json; do
            [ -f "$manifest" ] || continue
            seen=$((seen + 1))
            if ! meta=$(jq -er 'if (.name|type) == "string" and (.name|length) > 0
                and (.version|type) == "string" and (.version|length) > 0
              then "\(.private == true) \(.name)@\(.version)" else halt_error(1) end' \
              "$manifest" 2>/dev/null); then
              echo "::error::$manifest is not readable as a package with a name and version"
              rc=1
              continue
            fi
            [ "${meta%% *}" = "true" ] || continue
            tag=${meta#* }
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>"$err"); then
              [ "$draft" = "true" ] || continue
              echo "publishing $tag"
              gh release edit "$tag" --draft=false \
                || { echo "::error::failed to publish $tag"; rc=1; }
              continue
            fi
            case "$(cat "$err")" in
              *'release not found'*|*'HTTP 404'*|*'Not Found'*)
                if printf '%s\n' "$released" | grep -qxF "$manifest"; then
                  echo "::error::$tag was released by this commit but has no GitHub release"
                  rc=1
                fi
                ;;
              *) echo "::error::gh release view $tag: $(cat "$err")"; rc=1 ;;
            esac
          done
          if [ "$seen" -eq 0 ]; then
            echo "::error::no plugin manifests found under plugins/*/package.json"
            rc=1
          fi
          exit "$rc"
