name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # The release branch queues instead of cancelling: a cancellation that races
  # a just-started job can leave it stuck holding this group until its timeout.
  # oakum writes the version PR through the GitHub API in one shot, so there is
  # no second push to race — but the stuck-group hazard is reason enough.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'oakum/version-packages' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      modules: ${{ steps.modules.outputs.plugins }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Push builds run everything; PR builds skip ShellCheck when the diff
      # touches no shell script, and the summary job counts that skip as satisfied.
      - name: Classify the diff
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed files:\n%s\n' "$changed"
          shell=false
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash)$'; then
            shell=true
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"

      # Every plugin with a hooks module, so a new one is tested without a
      # workflow edit. An empty list fails rather than skipping Hook tests.
      - name: List hooks modules
        id: modules
        run: |
          set -o pipefail
          files=$(grep -l '"modules"' plugins/*/hooks/hooks.json) || {
            if [ "$?" -eq 1 ]; then
              echo "::error title=Hook tests::no plugin with a hooks module found"
            else
              echo "::error title=Hook tests::could not read every plugins/*/hooks/hooks.json"
            fi
            exit 1
          }
          plugins=$(printf '%s\n' "$files" | cut -d/ -f2 | jq -Rnc '[inputs]')
          printf 'plugins with hooks modules: %s\n' "$plugins"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  bump-files:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      # Fork pull requests cannot read secrets, so minting is guarded on the PR
      # coming from this repository. Without the guard the mint fails and takes
      # the whole job with it; with it, `pr-status` falls back to the default
      # token, finds no write permission, and writes its plan to the job
      # summary instead (oakum ADR-0015).
      - name: Mint app token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins
          permission-pull-requests: write

      # The only bump-file gate there is. A local PreToolUse hook used to run
      # a looser version of this check and was retired: it offered a hand bump
      # as an alternative to a bump file and waived docs and tests, and
      # --strict refuses both. Nothing checks before the push, so an uncovered
      # change is caught here. The version PR carries real bumps instead of
      # bump files.
      #
      # Identity, not a branch name: a fork, a person, and a push to the bot's
      # branch each fail one of these terms and get checked. Without the sender
      # term anyone with write access could push to the bot's branch and inherit
      # the exemption on the resulting `synchronize` run.
      - name: Check bump files
        if: >-
          github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot'
        run: pnpm exec oakum check --strict

      - name: Post the release plan
        id: pr-status
        if: success() || failure()
        continue-on-error: true
        run: pnpm exec oakum ci pr-status
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `continue-on-error` keeps an outage from failing the check; this keeps a
      # step that failed from reading as one that reported. A post that fell back
      # to the job summary is not this, and is by design.
      - name: Release plan did not post
        if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so its report may not have reached the pull request or the job summary; the check above still decides"

  lint:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Lint markdown
        run: pnpm exec markdownlint-cli2 "**/*.md"

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # validate is a static manifest check and needs no Anthropic credentials
      # (verified against an empty HOME and config dir). Installed unpinned:
      # the validate contract is stable, and a break from a CLI update should
      # surface here loudly rather than age silently behind a pin.
      #
      # On the runner's Node, never after pnpm/setup: the CLI is a native
      # binary (bin `claude.exe`), so only its postinstall runs on Node, and
      # `npm` on pnpm's npm-less Node puts `claude` in a global folder off PATH
      # (measured on macOS).
      # jactionlint ignore=adhoc-packages
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          status=0
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict || status=1
          done
          exit "$status"

  # One job per plugin: the hook tests are the slowest step in CI, and the
  # plugins' suites take about the same time.
  hook-tests:
    name: Hook tests (${{ matrix.plugin }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unpinned and on the runner's Node, as in Plugin manifests.
      # jactionlint ignore=adhoc-packages
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # A Claude Code without mods (before v2.1.287) prints a notice and exits
      # 0 having run nothing, so the step requires the run to report the
      # tests it ran.
      - name: Test hooks module
        env:
          PLUGIN: plugins/${{ matrix.plugin }}
        run: |
          status=0
          out=$(claude plugin test "$PLUGIN" 2>&1) || status=1
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qE '^Ran [1-9][0-9]* tests?'; then
            printf '::error::%s: claude plugin test ran no tests\n' "$PLUGIN"
            status=1
          fi
          exit "$status"

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (version from `packageManager`), Node, and the
      # workspace's dependencies, TypeScript among them.
      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      # Against types/claude-code/claude-code.d.ts (AGENTS.md says where it
      # comes from).
      - name: Type-check hooks modules
        run: pnpm typecheck

      # The modules' pure logic and the prose anchors; register.ts runs under
      # `claude plugin test` in Hook tests.
      - name: Unit tests
        run: pnpm test

      # oxlint's typeAware rules run through oxlint-tsgolint.
      - name: Lint and format-check TypeScript
        run: |
          pnpm lint
          pnpm format:check

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The eval scaffolds are the repository's only shell; nothing else
      # exercises them outside an eval run.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' | sort
          )
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck --external-sources --severity=warning "${files[@]}"

  # jactionlint, a maintained fork of actionlint: it reads `$/` action
  # references (and checks their inputs) and lints the composite actions in
  # `.github/actions/` too. It runs the default profile, security rules included.
  jactionlint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pinned release binary checked against its published checksum rather
      # than a third-party action. Renovate does not watch it: its `github-actions`
      # manager reads `uses:`, not `env:`, and `.github/renovate.json` defines
      # no `customManagers` — so this pin ages until someone moves it
      # deliberately. The version and the checksum move together; bumping one
      # alone fails the step rather than installing something unverified.
      - name: Install jactionlint
        env:
          JACTIONLINT_VERSION: 2.2.0
          JACTIONLINT_SHA256: 8137d5bfe266dd5e48d2af2306827785ce07c6988e04b1c3d6ad4776e97d27d2
        run: |
          tarball="$RUNNER_TEMP/jactionlint.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/jdx/jactionlint/releases/download/v${JACTIONLINT_VERSION}/jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$JACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" jactionlint
          sudo install "$RUNNER_TEMP/jactionlint" /usr/local/bin/jactionlint
          # The checksum covers the tarball, not what the next step resolves.
          # A jactionlint earlier on PATH would lint in its place, and a bare
          # `--version` reads as a check while asserting nothing.
          installed="$(jactionlint --version | head -1)"
          if [ "$installed" != "$JACTIONLINT_VERSION" ]; then
            echo "jactionlint on PATH is $installed, expected $JACTIONLINT_VERSION" >&2
            exit 1
          fi

      # jactionlint skips `run:` blocks when shellcheck is missing from PATH,
      # with a note on stderr and exit 0 (measured on 2.2.0), so without this
      # the job would pass while checking far less than its name implies.
      - name: Verify shellcheck is present
        run: shellcheck --version

      # `--pyflakes=` disables pyflakes: no `shell: python` block exists here.
      #
      # `run:` blocks are held to a stricter bar than the ShellCheck job holds
      # `*.sh` (`--severity=warning`): an info-level finding fails the build.
      # Deliberate — a gate is the wrong place to be lenient. shellcheck's own
      # version floats with the runner image, unlike jactionlint, pinned above.
      - name: Lint workflows
        run: jactionlint --pyflakes= --format github

  # The single required check: the branch ruleset gates on this job alone, so
  # adding or renaming jobs never needs a ruleset edit. Every job above must be
  # listed in `needs` — an omitted job is invisible to the gate.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): a skipped required check counts as
    # satisfied, so cancellation must yield a red X here, not a skip.
    if: always()
    needs: [changes, bump-files, lint, validate, hook-tests, typescript, shellcheck, jactionlint]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Reads every job from `needs`, so a job listed there is gated without
      # editing this step. A job skips by its own condition (Bump files on
      # push, ShellCheck with no shell change) or because a job it needs
      # failed, and that one is gated here too.
      - name: Gate on all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # A gate that dies before its verdict must not read as a pass.
          verdict=
          trap 'rc=$?
            if [ -z "$verdict" ]; then
              [ "$rc" -ne 0 ] || rc=1
              echo "::error title=CI gate::gate aborted (exit $rc) before reaching a verdict"
              trap - EXIT
              exit "$rc"
            fi' EXIT INT TERM HUP

          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          results="$(mktemp)"
          expected=$(printf '%s' "$NEEDS" | jq -r 'if type == "object" then length else error("needs is not an object") end')
          case "$expected" in
            ''|*[!0-9]*|0)
              echo "::error title=CI gate::could not read any job from needs"
              verdict=reached
              exit 1
              ;;
          esac
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' > "$results"

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$summary" ||
            echo "::warning title=CI gate::step summary unwritable; the verdict is unaffected"

          seen=0
          failed=0
          while IFS=$'\t' read -r job result; do
            seen=$((seen + 1))
            # shellcheck disable=SC2016 # the backticks are markdown, not a subshell
            printf '| %s | `%s` |\n' "$job" "$result" >> "$summary" || :
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error title=CI gate::Job '${job:-<empty>}' did not succeed (result: $result)"
                failed=1
                ;;
            esac
          done < "$results"

          if [ "$seen" -ne "$expected" ]; then
            echo "::error title=CI gate::read $seen of $expected jobs, so results were truncated"
            verdict=reached
            exit 1
          fi

          verdict=reached
          exit "$failed"
