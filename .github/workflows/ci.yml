name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # The release branch queues instead of cancelling: a cancellation that races
  # a just-started job can leave it stuck holding this group until its timeout.
  # oakum writes the version PR through the GitHub API in one shot, so there is
  # no second push to race — but the stuck-group hazard is reason enough.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'oakum/version-packages' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      bats: ${{ steps.filter.outputs.bats }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Push builds run everything; PR builds skip the shell-surface jobs when
      # the diff touches no shell, hook, script, or test file. The summary job
      # counts their skips as satisfied, so gating semantics are unchanged.
      - name: Classify the diff
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            echo "bats=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed files:\n%s\n' "$changed"
          shell=false
          bats=false
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash|bats)$|(^|/)bin/|(^|/)hooks/'; then
            shell=true
          fi
          # `plugins/` is in scope because tests/execution-receipt.bats scans
          # the agent and skill markdown: a diff that only edits an agent body
          # is exactly the diff that guard exists to catch.
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash|bats)$|(^|/)(bin|hooks|tests)/|^plugins/|^\.github/workflows/|package\.json$|pnpm-lock\.yaml$'; then
            bats=true
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "bats=$bats" >> "$GITHUB_OUTPUT"

  bump-files:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # Fork pull requests cannot read secrets, so minting is guarded on the PR
      # coming from this repository. Without the guard the mint fails and takes
      # the whole job with it; with it, `pr-status` falls back to the default
      # token, finds no write permission, and writes its plan to the job
      # summary instead (oakum ADR-0015).
      - name: Mint app token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins

      # CI-side twin of the local PreToolUse bump gate, but not its equal.
      # --strict raises the level of coverage — per-plugin rather than
      # any-bump-file-at-all — while honouring none of the hook's path
      # exemptions: the hook lets a plugins/<x>/package.json edit through and
      # oakum still demands intent for it. The version PR carries real bumps
      # instead of bump files.
      #
      # Identity, not a branch name: a fork, a person, and a push to the bot's
      # branch each fail one of these terms and get checked. Without the sender
      # term anyone with write access could push to the bot's branch and inherit
      # the exemption on the resulting `synchronize` run.
      - name: Check bump files
        if: >-
          github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot'
        run: pnpm exec oakum check --strict

      - name: Post the release plan
        id: pr-status
        if: success() || failure()
        continue-on-error: true
        run: pnpm exec oakum ci pr-status
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `continue-on-error` keeps an outage from failing the check; this keeps a
      # step that failed from reading as one that reported. A post that fell back
      # to the job summary is not this, and is by design.
      - name: Release plan did not post
        if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so its report may not have reached the pull request or the job summary; the check above still decides"

  lint:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Lint markdown
        run: pnpm exec markdownlint-cli2 "**/*.md"

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # validate is a static manifest check and needs no Anthropic credentials
      # (verified against an empty HOME and config dir). Installed unpinned:
      # the validate contract is stable, and a break from a CLI update should
      # surface here loudly rather than age silently behind a pin.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          status=0
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict || status=1
          done
          exit "$status"

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hooks fail open by design, so a defect here disables the gate
      # silently rather than erroring — which is exactly what static analysis
      # catches and the bats suites, testing behavior, cannot.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' | sort
          )
          files+=(bin/run-bats plugins/review-cycle/bin/review-sentinel)
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck --external-sources --severity=warning "${files[@]}"

  tests:
    name: Bats (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bats == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed from the git tag rather than npm: npm's `bats` lags at 1.13.0
      # while local development runs 1.14.0, and `bin/run-bats` works around a
      # post-suite hang whose behavior is version-specific — CI diverging from
      # local is the one place that difference must not appear. Pinned for the
      # same reason: an unpinned bump could change what the wrapper compensates
      # for without any change landing in this repo.
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version

      - name: Verify sha256 tool is present
        run: |
          command -v sha256sum || command -v shasum

      # Always through the wrapper, never bare `bats` — a direct invocation
      # leaves an orphaned process tree after the final TAP line. Both runners,
      # because the wrapper's process handling is the part that differs between
      # Linux and macOS.
      #
      # One whole-repo invocation, which is both the command a developer runs
      # and the only shape that exercises the concurrent merge every other
      # suite's results pass through. A failure still names its file: bats
      # writes the failing file and line in a `#` diagnostic under each
      # `not ok`, and the merge passes those lines through untouched.
      #
      # The checks below re-read the printed stream for self-consistency —
      # plan, count, numbering. That catches a wrapper that reported its own
      # run wrongly. It cannot authenticate the stream: a suite writing a
      # TAP-shaped line to bats's fd 3 lands in it unprefixed, which the
      # wrapper rejects per file before merging. Nor can it see work lost
      # before printing, so discovery is checked against a `find` this step
      # runs itself.
      - name: Run bats suites
        run: |
          status=0
          rc=0
          out="$(bin/run-bats 2>&1)" || rc=$?
          # Printed before anything is derived from it: the derivations are
          # what fail when a run went wrong, and the evidence has to outlive
          # them.
          printf '%s\n' "$out"

          # `|| status=1` alone records that the wrapper refused and discards
          # why. Exit 2 is its report that results went missing, and the
          # re-derivation below cannot see what never reached the stream.
          if [ "$rc" -ne 0 ]; then
            printf '::error::bin/run-bats exited %s\n' "$rc"
            status=1
          fi

          # One pass rather than a `grep -c` per number: `grep` exits 1 on no
          # match and 2 on failure, `|| true` folds both to 0, and a count
          # left empty that way reads as false in every numeric test below.
          summary="$(printf '%s\n' "$out" | LC_ALL=C awk '
            /^1\.\.[0-9]+$/  { plans++; if (plans == 1) planned = substr($0, 4); next }
            /^ok [0-9]+/     { n++; if ($2 != n) misnumbered++; next }
            /^not ok [0-9]+/ { n++; failed++; if ($3 != n) misnumbered++; next }
            END { printf "%d %d %d %d %s\n", n, failed + 0, misnumbered + 0,
                                             plans + 0, (plans ? planned : "-") }
          ')"
          read -r reported failed misnumbered plans planned <<< "$summary"
          # Each field on its own. Concatenating them first lets one empty
          # value hide behind another's digits, and an empty value makes every
          # `-ne` below return 2, which an `if` reads as "no problem". No
          # measured input reaches this: an awk that exits non-zero aborts the
          # assignment above under `-e`, and one broken enough to garble this
          # program garbles the wrapper's merge too. Kept because what it
          # prevents is a silent green.
          for value in "$reported" "$failed" "$misnumbered" "$plans"; do
            case "$value" in
              ''|*[!0-9]*)
                printf '::error::could not read the TAP stream (awk said: %s)\n' "$summary"
                exit 1 ;;
            esac
          done

          # Without this, a stream carrying no results at all satisfies every
          # check below by vacuity.
          if [ "$reported" -eq 0 ]; then
            printf '::error::no test results in the output\n'
            status=1
          fi
          # The wrapper prints exactly one plan, first. A second means results
          # belonging to a plan nothing compared them against.
          if [ "$plans" -ne 1 ]; then
            printf '::error::expected one TAP plan, found %s\n' "$plans"
            status=1
          elif [ "${#planned}" -gt 18 ]; then
            # awk guarantees $planned is digits, not that it fits the integers
            # `[` compares. 18 is the widest that always does; a longer value
            # may still be comparable, and is reported rather than compared
            # because a plan that wide means the stream is already wrong.
            printf '::error::the TAP plan is not a usable number: %s\n' "$planned"
            status=1
          elif [ "$planned" -ne "$reported" ]; then
            # Both directions reach here and they are different faults. bats
            # emits results past its own plan when setup_file or teardown_file
            # fails, so calling that truncation sends a reader hunting for
            # tests that were never lost.
            if [ "$reported" -lt "$planned" ]; then
              printf '::error::truncated: planned %s, reported %s\n' \
                "$planned" "$reported"
            else
              printf '::error::plan says %s but %s results were reported\n' \
                "$planned" "$reported"
            fi
            status=1
          fi
          if [ "$failed" -ne 0 ]; then
            # bats names the file under every `not ok`, and a failure inside a
            # helper names the helper first -- both shapes end in `in test
            # file X, line N`, so one pattern reaches both. Extracted so the
            # annotation panel carries the suites rather than only a count.
            suites="$(printf '%s\n' "$out" \
              | sed -n 's/.*in test file \([^,]*\),.*/\1/p' \
              | sort -u | tr '\n' ' ')"
            printf '::error::%s failing test(s) in: %s\n' \
              "$failed" "${suites:-file not named}"
            status=1
          fi
          # Counts alone miss every defect that preserves them, so the awk
          # above re-derives the numbering as it counts.
          if [ "$misnumbered" -ne 0 ]; then
            printf '::error::%s result(s) are not numbered contiguously\n' \
              "$misnumbered"
            status=1
          fi

          # bats emits this when the number of tests it executed differs from
          # its own plan, which is how a suite that ran short announces itself
          # when it survives long enough to say so. It arrives `# `-prefixed on
          # stdout, so this matches as a substring rather than anchoring.
          case "$out" in
            *"bats warning: Executed"*)
              printf '::error::bats reported executing a different number of tests than it planned\n'
              status=1 ;;
          esac

          # An independent `find`, because a run of the wrapper cannot check
          # the wrapper's own discovery: a suite it never looks for is silent,
          # and every count downstream of it stays consistent. Compared as
          # strings, so a wrapper that stops reporting the number fails here
          # loudly rather than disabling the check.
          # A walk that died partway through -- an unreadable subtree, a
          # symlink loop -- must not be counted: the wrapper's discovery
          # carries the same predicates and degrades the same way, so the two
          # counts would agree on the undercount. Capturing `find` alone lets
          # `-e` see its status, and naming it here turns a bare abort into a
          # line that says which step failed and why.
          if ! found="$(find . -type f -name '*.bats' \
               -not -path '*/.git/*' -not -path '*/node_modules/*')"; then
            printf '::error::the discovery walk failed, so its count proves nothing\n'
            status=1
          fi
          expected_files="$(printf '%s\n' "$found" | grep -c . || true)"
          ran_files="$(printf '%s\n' "$out" \
            | sed -n 's|^bin/run-bats: \([0-9]\{1,\}\) files$|\1|p' | head -1)"
          if [ "$ran_files" != "$expected_files" ]; then
            printf '::error::the run covered %s files, this step found %s\n' \
              "${ran_files:-<no count reported>}" "$expected_files"
            status=1
          fi

          printf '\n%s tests reported from %s files\n' "$reported" "$expected_files"
          exit "$status"

  # The single required check: the branch ruleset gates on this job alone, so
  # adding or renaming jobs never needs a ruleset edit. Every job above must be
  # listed in `needs` — an omitted job is invisible to the gate.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): a skipped required check counts as
    # satisfied, so cancellation must yield a red X here, not a skip.
    if: always()
    needs: [changes, bump-files, lint, validate, shellcheck, tests]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Summarize results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Required |"
            echo "| --- | --- | --- |"
            echo "| Bump files | \`${{ needs.bump-files.result }}\` | Yes (PRs; skips on push) |"
            echo "| Markdown | \`${{ needs.lint.result }}\` | Yes |"
            echo "| Plugin manifests | \`${{ needs.validate.result }}\` | Yes |"
            echo "| ShellCheck | \`${{ needs.shellcheck.result }}\` | Yes (skips when no shell surface changed) |"
            echo "| Bats (both OSes) | \`${{ needs.tests.result }}\` | Yes (skips when no shell/test surface changed) |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail_if_bad() {
            if [ "$2" = "failure" ] || [ "$2" = "cancelled" ]; then
              echo "Job '$1' failed or was cancelled"
              exit 1
            fi
          }

          fail_if_bad "changes" "${{ needs.changes.result }}"
          fail_if_bad "bump-files" "${{ needs.bump-files.result }}"
          fail_if_bad "lint" "${{ needs.lint.result }}"
          fail_if_bad "validate" "${{ needs.validate.result }}"
          fail_if_bad "shellcheck" "${{ needs.shellcheck.result }}"
          fail_if_bad "tests" "${{ needs.tests.result }}"
