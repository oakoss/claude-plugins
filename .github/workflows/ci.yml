name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Cross-file consistency the commit-time bump gate can't see: plugin.json,
      # marketplace.json, package.json, and a CHANGELOG heading must agree per
      # plugin. The script has no dependencies, so no npm install.
      - name: Check version drift
        run: node scripts/sync-plugin-versions.mjs --check

  bump-files:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI-side twin of the local PreToolUse bump gate: fails the PR when a
      # changed plugin has no bump file, and posts a release-plan comment.
      # --strict matches the local gate's per-plugin coverage (the default only
      # fails when no bump files exist at all). The version PR carries real
      # bumps instead of bump files and passes.
      - name: Check bump files
        run: pnpm exec bumpy ci check --strict
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    name: Markdown and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint markdown
        run: pnpm exec markdownlint-cli2 "**/*.md"

      # oxfmt is scoped to hand-written scripts only: skill/agent markdown is
      # runtime prose, changelogs are bumpy-generated, and the plugin manifests
      # are written by the sync script — formatting any of those creates churn
      # against their generators.
      - name: Check script formatting
        run: pnpm exec oxfmt --check scripts

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # validate is a static manifest check and needs no Anthropic credentials
      # (verified against an empty HOME and config dir). Installed unpinned:
      # the validate contract is stable, and a break from a CLI update should
      # surface here loudly rather than age silently behind a pin.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          status=0
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict || status=1
          done
          exit "$status"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The hooks fail open by design, so a defect here disables the gate
      # silently rather than erroring — which is exactly what static analysis
      # catches and the bats suites, testing behavior, cannot.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' | sort
          )
          files+=(bin/run-bats plugins/review-cycle/bin/review-sentinel)
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck --external-sources --severity=warning "${files[@]}"

  tests:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Installed from the git tag rather than npm: npm's `bats` lags at 1.13.0
      # while local development runs 1.14.0, and `bin/run-bats` works around a
      # post-suite hang whose behavior is version-specific — CI diverging from
      # local is the one place that difference must not appear. Pinned for the
      # same reason: an unpinned bump could change what the wrapper compensates
      # for without any change landing in this repo.
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version

      - name: Verify sha256 tool is present
        run: |
          command -v sha256sum || command -v shasum

      # Always through the wrapper, never bare `bats` — a direct invocation
      # leaves an orphaned process tree after the final TAP line. Running on
      # both runners is deliberate: the wrapper's process handling is the part
      # that differs between Linux and macOS.
      #
      # One suite per invocation rather than a single whole-repo run, for
      # per-suite failure attribution and to keep each run comfortably inside
      # the wrapper's stall timeout. The plan-vs-result check is defence in
      # depth: the wrapper already exits 2 on a short run, so this would only
      # catch a regression in that reporting.
      - name: Run bats suites
        run: |
          status=0
          total=0
          while IFS= read -r suite; do
            out="$(bin/run-bats "$suite" 2>&1)" || status=1
            printf '%s\n' "$out"

            planned="$(printf '%s\n' "$out" | sed -n 's/^1\.\.\([0-9]\{1,\}\)$/\1/p' | tail -1)"
            reported="$(printf '%s\n' "$out" | grep -cE '^(not )?ok ')"
            failed="$(printf '%s\n' "$out" | grep -cE '^not ok' || true)"
            total=$((total + reported))

            if [ -z "$planned" ]; then
              printf '::error::%s emitted no TAP plan\n' "$suite"
              status=1
            elif [ "$planned" -ne "$reported" ]; then
              printf '::error::%s truncated: planned %s, reported %s\n' \
                "$suite" "$planned" "$reported"
              status=1
            fi
            if [ "$failed" -ne 0 ]; then
              printf '::error::%s had %s failing test(s)\n' "$suite" "$failed"
              status=1
            fi
          done < <(find . -type f -name '*.bats' -not -path './.git/*' -not -path './node_modules/*' | sort)

          printf '\n%d tests reported across all suites\n' "$total"
          exit "$status"
