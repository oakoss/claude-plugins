name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # The release branch queues instead of cancelling: a cancellation that races
  # a just-started job can leave it stuck holding this group until its timeout.
  # oakum writes the version PR through the GitHub API in one shot, so there is
  # no second push to race — but the stuck-group hazard is reason enough.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'oakum/version-packages' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Push builds run everything; PR builds skip ShellCheck when the diff
      # touches no shell script, and the summary job counts that skip as satisfied.
      - name: Classify the diff
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed files:\n%s\n' "$changed"
          shell=false
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash)$'; then
            shell=true
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"

  bump-files:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # Fork pull requests cannot read secrets, so minting is guarded on the PR
      # coming from this repository. Without the guard the mint fails and takes
      # the whole job with it; with it, `pr-status` falls back to the default
      # token, finds no write permission, and writes its plan to the job
      # summary instead (oakum ADR-0015).
      - name: Mint app token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins

      # The only bump-file gate there is. A local PreToolUse hook used to run
      # a looser version of this check and was retired: it offered a hand bump
      # as an alternative to a bump file and waived docs and tests, and
      # --strict refuses both. Nothing checks before the push, so an uncovered
      # change is caught here. The version PR carries real bumps instead of
      # bump files.
      #
      # Identity, not a branch name: a fork, a person, and a push to the bot's
      # branch each fail one of these terms and get checked. Without the sender
      # term anyone with write access could push to the bot's branch and inherit
      # the exemption on the resulting `synchronize` run.
      - name: Check bump files
        if: >-
          github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot'
        run: pnpm exec oakum check --strict

      - name: Post the release plan
        id: pr-status
        if: success() || failure()
        continue-on-error: true
        run: pnpm exec oakum ci pr-status
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `continue-on-error` keeps an outage from failing the check; this keeps a
      # step that failed from reading as one that reported. A post that fell back
      # to the job summary is not this, and is by design.
      - name: Release plan did not post
        if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so its report may not have reached the pull request or the job summary; the check above still decides"

  lint:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Lint markdown
        run: pnpm exec markdownlint-cli2 "**/*.md"

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # validate is a static manifest check and needs no Anthropic credentials
      # (verified against an empty HOME and config dir). Installed unpinned:
      # the validate contract is stable, and a break from a CLI update should
      # surface here loudly rather than age silently behind a pin.
      #
      # On the runner's Node, before pnpm/setup, on purpose: the CLI is a native
      # binary (bin `claude.exe`), so only its postinstall runs on Node. After
      # pnpm/setup, `npm` would run on pnpm's npm-less Node, whose real path is
      # in pnpm's store, and would put `claude` in a global folder off PATH
      # (measured on macOS).
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          status=0
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict || status=1
          done
          exit "$status"

      # Hooks modules are early access. Without this variable `claude plugin
      # test` prints a notice and exits 0 having run nothing, so the step also
      # requires each run to report the tests it ran.
      - name: Test hooks modules
        env:
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
        run: |
          status=0
          for plugin in plugins/*/; do
            grep -qs '"modules"' "$plugin/hooks/hooks.json" || continue
            out=$(claude plugin test "$plugin" 2>&1) || status=1
            printf '%s\n' "$out"
            if ! printf '%s\n' "$out" | grep -qE '^Ran [1-9][0-9]* tests?'; then
              printf '::error::%s: claude plugin test ran no tests\n' "$plugin"
              status=1
            fi
          done
          exit "$status"

      # Installs pnpm (version from `packageManager`), Node, and the
      # workspace's dependencies, TypeScript among them.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # Against types/claude-code/claude-code.d.ts, which `/plugin-types`
      # writes and which needs a login to regenerate, so it is committed.
      - name: Type-check hooks modules
        run: pnpm typecheck

      # The modules' pure logic and the prose anchors; register.ts runs under
      # `claude plugin test` above.
      - name: Unit tests
        run: pnpm test

      # oxlint's typeAware rules run through oxlint-tsgolint.
      - name: Lint and format-check TypeScript
        run: |
          pnpm lint
          pnpm format:check

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The eval scaffolds are the repository's only shell; nothing else
      # exercises them outside an eval run.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' | sort
          )
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck --external-sources --severity=warning "${files[@]}"

  # `.github/workflows/` only. actionlint reads a composite action file as a
  # workflow and reports `"jobs" section is missing`, and the ShellCheck job's
  # file set is `*.sh`/`*.bash` — so the shell inside `.github/actions/` is
  # linted by nothing.
  actionlint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pinned release binary checked against its published checksum rather
      # than a third-party action. Renovate does not watch it: its `github-actions`
      # manager reads `uses:`, not `env:`, and `.github/renovate.json` defines
      # no `customManagers` — so this pin ages until someone moves it
      # deliberately. The version and the checksum move together; bumping one
      # alone fails the step rather than installing something unverified.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          sudo install "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          # The checksum covers the tarball, not what the next step resolves.
          # An actionlint earlier on PATH would lint in its place, and a bare
          # `--version` reads as a check while asserting nothing.
          installed="$(actionlint --version | head -1)"
          if [ "$installed" != "$ACTIONLINT_VERSION" ]; then
            echo "actionlint on PATH is $installed, expected $ACTIONLINT_VERSION" >&2
            exit 1
          fi

      # actionlint shells out to shellcheck for `run:` blocks and skips them
      # silently when it cannot find it, so without this the job would pass
      # while checking far less than its name implies. The `run:` blocks are
      # most of what there is to get wrong in this file.
      - name: Verify shellcheck is present
        run: shellcheck --version

      # `-pyflakes=` rather than absent: pyflakes is skipped as silently as
      # shellcheck would be, and no `shell: python` block exists here, so
      # disabling it is a decision rather than a property of the runner image.
      #
      # The plain run decides the verdict and writes the log; the second pass
      # only adds annotations. `-format` replaces the caret diagram, and a
      # template that parses but fails mid-range emits some annotations and not
      # others — so running plain first keeps every finding in the log, and a
      # broken template costs presentation rather than evidence.
      #
      # No severity floor is available, so `run:` blocks are held to a stricter
      # bar than the ShellCheck job holds `*.sh` (`--severity=warning`): an
      # info-level finding fails the build. Deliberate — a gate is the wrong
      # place to be lenient. shellcheck's own version floats with the runner
      # image, unlike actionlint, pinned above to a version and a checksum.
      - name: Lint workflows
        env:
          # A template newline: actionlint 1.7.12 re-escapes the backslash in
          # `{{"\n"}}` and then rejects it. `{{println}}` works; YAML resolving
          # `\n` here reads better than either.
          ACTIONLINT_FORMAT: "{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}},col={{$e.Column}}::{{$e.Message}}\n{{end}}"
        run: |
          rc=0
          actionlint -pyflakes= || rc=$?
          # Only exit 1 means findings, so only exit 1 can yield annotations.
          # Leaving on anything else spares a second invocation that would
          # lint nothing and reprint the same diagnostic — measured on a
          # broken config: four occurrences before this gate, two after.
          [ "$rc" -eq 1 ] || exit "$rc"
          actionlint -pyflakes= -format "$ACTIONLINT_FORMAT" || true
          exit "$rc"

  # The single required check: the branch ruleset gates on this job alone, so
  # adding or renaming jobs never needs a ruleset edit. Every job above must be
  # listed in `needs` — an omitted job is invisible to the gate.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): a skipped required check counts as
    # satisfied, so cancellation must yield a red X here, not a skip.
    if: always()
    needs: [changes, bump-files, lint, validate, shellcheck, actionlint]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Summarize results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Required |"
            echo "| --- | --- | --- |"
            echo "| Bump files | \`${{ needs.bump-files.result }}\` | Yes (PRs; skips on push) |"
            echo "| Markdown | \`${{ needs.lint.result }}\` | Yes |"
            echo "| Plugin manifests | \`${{ needs.validate.result }}\` | Yes |"
            echo "| ShellCheck | \`${{ needs.shellcheck.result }}\` | Yes (skips when no shell surface changed) |"
            echo "| Workflows | \`${{ needs.actionlint.result }}\` | Yes |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail_if_bad() {
            if [ "$2" = "failure" ] || [ "$2" = "cancelled" ]; then
              echo "Job '$1' failed or was cancelled"
              exit 1
            fi
          }

          fail_if_bad "changes" "${{ needs.changes.result }}"
          fail_if_bad "bump-files" "${{ needs.bump-files.result }}"
          fail_if_bad "lint" "${{ needs.lint.result }}"
          fail_if_bad "validate" "${{ needs.validate.result }}"
          fail_if_bad "shellcheck" "${{ needs.shellcheck.result }}"
          fail_if_bad "actionlint" "${{ needs.actionlint.result }}"
