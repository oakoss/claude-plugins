name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # The release branch queues instead of cancelling: a cancellation that races
  # a just-started job can leave it stuck holding this group until its timeout.
  # oakum writes the version PR through the GitHub API in one shot, so there is
  # no second push to race — but the stuck-group hazard is reason enough.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'oakum/version-packages' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      bats: ${{ steps.filter.outputs.bats }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Push builds run everything; PR builds skip the shell-surface jobs when
      # the diff touches no shell, hook, script, or test file. The summary job
      # counts their skips as satisfied, so gating semantics are unchanged.
      - name: Classify the diff
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            echo "bats=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed files:\n%s\n' "$changed"
          shell=false
          bats=false
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash|bats)$|(^|/)bin/|(^|/)hooks/'; then
            shell=true
          fi
          # `plugins/` is in scope because tests/execution-receipt.bats scans
          # the agent and skill markdown: a diff that only edits an agent body
          # is exactly the diff that guard exists to catch.
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash|bats)$|(^|/)(bin|hooks|tests)/|^plugins/|^\.github/workflows/|package\.json$|pnpm-lock\.yaml$'; then
            bats=true
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "bats=$bats" >> "$GITHUB_OUTPUT"

  bump-files:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # Fork pull requests cannot read secrets, so minting is guarded on the PR
      # coming from this repository. Without the guard the mint fails and takes
      # the whole job with it; with it, `pr-status` falls back to the default
      # token, finds no write permission, and writes its plan to the job
      # summary instead (oakum ADR-0015).
      - name: Mint app token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins

      # CI-side twin of the local PreToolUse bump gate, but not its equal.
      # --strict raises the level of coverage — per-plugin rather than
      # any-bump-file-at-all — while honouring none of the hook's path
      # exemptions: the hook lets a plugins/<x>/package.json edit through and
      # oakum still demands intent for it. The version PR carries real bumps
      # instead of bump files.
      #
      # Identity, not a branch name: a fork, a person, and a push to the bot's
      # branch each fail one of these terms and get checked. Without the sender
      # term anyone with write access could push to the bot's branch and inherit
      # the exemption on the resulting `synchronize` run.
      - name: Check bump files
        if: >-
          github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot'
        run: pnpm exec oakum check --strict

      - name: Post the release plan
        id: pr-status
        if: success() || failure()
        continue-on-error: true
        run: pnpm exec oakum ci pr-status
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `continue-on-error` keeps an outage from failing the check; this keeps a
      # step that failed from reading as one that reported. A post that fell back
      # to the job summary is not this, and is by design.
      - name: Release plan did not post
        if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so its report may not have reached the pull request or the job summary; the check above still decides"

  lint:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Lint markdown
        run: pnpm exec markdownlint-cli2 "**/*.md"

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # validate is a static manifest check and needs no Anthropic credentials
      # (verified against an empty HOME and config dir). Installed unpinned:
      # the validate contract is stable, and a break from a CLI update should
      # surface here loudly rather than age silently behind a pin.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          status=0
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict || status=1
          done
          exit "$status"

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hooks fail open by design, so a defect here disables the gate
      # silently rather than erroring — which is exactly what static analysis
      # catches and the bats suites, testing behavior, cannot.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' | sort
          )
          files+=(bin/run-bats plugins/review-cycle/bin/review-sentinel)
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck --external-sources --severity=warning "${files[@]}"

  tests:
    name: Bats (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bats == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed from the git tag rather than npm: npm's `bats` lags at 1.13.0
      # while local development runs 1.14.0, and `bin/run-bats` works around a
      # post-suite hang whose behavior is version-specific — CI diverging from
      # local is the one place that difference must not appear. Pinned for the
      # same reason: an unpinned bump could change what the wrapper compensates
      # for without any change landing in this repo.
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version

      - name: Verify sha256 tool is present
        run: |
          command -v sha256sum || command -v shasum

      # Always through the wrapper, never bare `bats` — a direct invocation
      # leaves an orphaned process tree after the final TAP line. Running on
      # both runners is deliberate: the wrapper's process handling is the part
      # that differs between Linux and macOS.
      #
      # One suite per invocation rather than a single whole-repo run, for
      # per-suite failure attribution and to keep each run comfortably inside
      # the wrapper's stall timeout. The plan-vs-result check is defence in
      # depth: the wrapper already exits 2 on a short run, so this would only
      # catch a regression in that reporting.
      - name: Run bats suites
        run: |
          status=0
          total=0
          while IFS= read -r suite; do
            out="$(bin/run-bats "$suite" 2>&1)" || status=1
            printf '%s\n' "$out"

            planned="$(printf '%s\n' "$out" | sed -n 's/^1\.\.\([0-9]\{1,\}\)$/\1/p' | tail -1)"
            reported="$(printf '%s\n' "$out" | grep -cE '^(not )?ok ')"
            failed="$(printf '%s\n' "$out" | grep -cE '^not ok' || true)"
            total=$((total + reported))

            if [ -z "$planned" ]; then
              printf '::error::%s emitted no TAP plan\n' "$suite"
              status=1
            elif [ "$planned" -ne "$reported" ]; then
              printf '::error::%s truncated: planned %s, reported %s\n' \
                "$suite" "$planned" "$reported"
              status=1
            fi
            if [ "$failed" -ne 0 ]; then
              printf '::error::%s had %s failing test(s)\n' "$suite" "$failed"
              status=1
            fi
          done < <(find . -type f -name '*.bats' -not -path '*/.git/*' -not -path '*/node_modules/*' | sort)
          suites="$(find . -type f -name '*.bats' -not -path '*/.git/*' -not -path '*/node_modules/*' | wc -l | tr -d ' ')"


          printf '\n%d tests reported across all suites from %d files\n' "$total" "$suites"

          # The loop above calls the wrapper once per file, which is its
          # single-file path. One whole-repo call exercises the concurrent
          # merge, which nothing else on a runner reaches. It costs a second
          # full run of the suite, deliberately.
          merged="$(bin/run-bats 2>&1)" || status=1
          # Printed before anything is derived from it: the derivations are
          # what fail when a run went wrong, and the evidence has to outlive
          # them. Unabridged, as the per-suite loop prints its own output.
          printf '%s\n' "$merged"

          # `|| true` on the count: grep exits 1 when it matches nothing, the
          # step runs under `-e`, and a merged run that produced no results is
          # exactly what this block exists to catch -- it must not die here.
          merged_reported="$(printf '%s\n' "$merged" | grep -acE '^(not )?ok ' || true)"
          merged_planned="$(printf '%s\n' "$merged" | sed -n 's/^1\.\.\([0-9]\{1,\}\)$/\1/p' | tail -1)"
          if [ "$merged_reported" -ne "$total" ]; then
            printf '::error::merged run reported %s of the %s the per-suite loop did\n' \
              "$merged_reported" "$total"
            status=1
          fi
          if [ "$merged_planned" != "$total" ]; then
            printf '::error::merged plan says %s, per-suite loop counted %s\n' \
              "$merged_planned" "$total"
            status=1
          fi
          # Counts alone miss every defect that preserves them, so the
          # numbering is re-derived here rather than taken from the wrapper
          # that produced it.
          if ! printf '%s\n' "$merged" | grep -aE '^(not )?ok ' \
               | awk '{ if ($1 == "not") print $3; else print $2 }' \
               | awk 'NR != $1 { exit 1 }'; then
            printf '::error::merged results are not numbered 1..%s\n' "$merged_reported"
            status=1
          fi

          exit "$status"

  # The single required check: the branch ruleset gates on this job alone, so
  # adding or renaming jobs never needs a ruleset edit. Every job above must be
  # listed in `needs` — an omitted job is invisible to the gate.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): a skipped required check counts as
    # satisfied, so cancellation must yield a red X here, not a skip.
    if: always()
    needs: [changes, bump-files, lint, validate, shellcheck, tests]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Summarize results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Required |"
            echo "| --- | --- | --- |"
            echo "| Bump files | \`${{ needs.bump-files.result }}\` | Yes (PRs; skips on push) |"
            echo "| Markdown | \`${{ needs.lint.result }}\` | Yes |"
            echo "| Plugin manifests | \`${{ needs.validate.result }}\` | Yes |"
            echo "| ShellCheck | \`${{ needs.shellcheck.result }}\` | Yes (skips when no shell surface changed) |"
            echo "| Bats (both OSes) | \`${{ needs.tests.result }}\` | Yes (skips when no shell/test surface changed) |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail_if_bad() {
            if [ "$2" = "failure" ] || [ "$2" = "cancelled" ]; then
              echo "Job '$1' failed or was cancelled"
              exit 1
            fi
          }

          fail_if_bad "changes" "${{ needs.changes.result }}"
          fail_if_bad "bump-files" "${{ needs.bump-files.result }}"
          fail_if_bad "lint" "${{ needs.lint.result }}"
          fail_if_bad "validate" "${{ needs.validate.result }}"
          fail_if_bad "shellcheck" "${{ needs.shellcheck.result }}"
          fail_if_bad "tests" "${{ needs.tests.result }}"
