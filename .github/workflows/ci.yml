name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # The release branch queues instead of cancelling: a cancellation that races
  # a just-started job can leave it stuck holding this group until its timeout.
  # oakum writes the version PR through the GitHub API in one shot, so there is
  # no second push to race — but the stuck-group hazard is reason enough.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'oakum/version-packages' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      bats: ${{ steps.filter.outputs.bats }}
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Push builds run everything; PR builds skip the shell-surface jobs when
      # the diff touches no shell, hook, script, or test file. The summary job
      # counts their skips as satisfied, so gating semantics are unchanged.
      - name: Classify the diff
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            echo "bats=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed files:\n%s\n' "$changed"
          shell=false
          bats=false
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash|bats)$|(^|/)bin/|(^|/)hooks/'; then
            shell=true
          fi
          # `plugins/` is in scope because tests/execution-receipt.bats scans
          # the agent and skill markdown: a diff that only edits an agent body
          # is exactly the diff that guard exists to catch.
          if printf '%s\n' "$changed" | grep -qE '\.(sh|bash|bats)$|(^|/)(bin|hooks|tests)/|^plugins/|^\.github/workflows/|package\.json$|pnpm-lock\.yaml$'; then
            bats=true
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "bats=$bats" >> "$GITHUB_OUTPUT"

  bump-files:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      # Fork pull requests cannot read secrets, so minting is guarded on the PR
      # coming from this repository. Without the guard the mint fails and takes
      # the whole job with it; with it, `pr-status` falls back to the default
      # token, finds no write permission, and writes its plan to the job
      # summary instead (oakum ADR-0015).
      - name: Mint app token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: claude-plugins

      # CI-side twin of the local PreToolUse bump gate, but not its equal.
      # --strict raises the level of coverage — per-plugin rather than
      # any-bump-file-at-all — while honouring none of the hook's path
      # exemptions: the hook lets a plugins/<x>/package.json edit through and
      # oakum still demands intent for it. The version PR carries real bumps
      # instead of bump files.
      #
      # Identity, not a branch name: a fork, a person, and a push to the bot's
      # branch each fail one of these terms and get checked. Without the sender
      # term anyone with write access could push to the bot's branch and inherit
      # the exemption on the resulting `synchronize` run.
      - name: Check bump files
        if: >-
          github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot'
        run: pnpm exec oakum check --strict

      - name: Post the release plan
        id: pr-status
        if: success() || failure()
        continue-on-error: true
        run: pnpm exec oakum ci pr-status
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # `continue-on-error` keeps an outage from failing the check; this keeps a
      # step that failed from reading as one that reported. A post that fell back
      # to the job summary is not this, and is by design.
      - name: Release plan did not post
        if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so its report may not have reached the pull request or the job summary; the check above still decides"

  lint:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs pnpm (version from `packageManager`), Node, and the
      # dependencies in one step; `require-lockfile` is `--frozen-lockfile`.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Lint markdown
        run: pnpm exec markdownlint-cli2 "**/*.md"

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # validate is a static manifest check and needs no Anthropic credentials
      # (verified against an empty HOME and config dir). Installed unpinned:
      # the validate contract is stable, and a break from a CLI update should
      # surface here loudly rather than age silently behind a pin.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          status=0
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict || status=1
          done
          exit "$status"

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hooks fail open by design, so a defect here disables the gate
      # silently rather than erroring — which is exactly what static analysis
      # catches and the bats suites, testing behavior, cannot.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' | sort
          )
          files+=(bin/run-bats plugins/review-cycle/bin/review-sentinel)
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck --external-sources --severity=warning "${files[@]}"

  tests:
    name: Bats (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bats == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed from the git tag rather than npm: npm's `bats` lags at 1.13.0
      # while local development runs 1.14.0, and `bin/run-bats` works around a
      # post-suite hang whose behavior is version-specific — CI diverging from
      # local is the one place that difference must not appear. Pinned for the
      # same reason: an unpinned bump could change what the wrapper compensates
      # for without any change landing in this repo.
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version

      - name: Verify sha256 tool is present
        run: |
          command -v sha256sum || command -v shasum

      # Always through the wrapper, never bare `bats` — a direct invocation
      # leaves an orphaned process tree after the final TAP line. Both runners,
      # because the wrapper's process handling is the part that differs between
      # Linux and macOS.
      #
      # One whole-repo invocation, which is both the command a developer runs
      # and the only shape that exercises the concurrent merge every other
      # suite's results pass through. A failure still names its file: bats
      # writes the failing file and line in a `#` diagnostic under each
      # `not ok`, and the merge passes those lines through untouched.
      #
      # The checks below re-read the printed stream for self-consistency —
      # plan, count, numbering. That catches a wrapper that reported its own
      # run wrongly. It cannot authenticate the stream: a suite writing a
      # TAP-shaped line to bats's fd 3 lands in it unprefixed, which the
      # wrapper rejects per file before merging. Nor can it see work lost
      # before printing, so discovery is checked against a `find` this step
      # runs itself.
      - name: Run bats suites
        run: |
          status=0
          rc=0
          out="$(bin/run-bats 2>&1)" || rc=$?
          # Printed before anything is derived from it: the derivations are
          # what fail when a run went wrong, and the evidence has to outlive
          # them.
          printf '%s\n' "$out"

          # `|| status=1` alone records that the wrapper refused and discards
          # why. Exit 2 is its report that results went missing, and nothing
          # below can see what never reached the stream.
          if [ "$rc" -ne 0 ]; then
            printf '::error::bin/run-bats exited %s\n' "$rc"
            status=1
          fi

          # Which awk this is decides the pass below, and the two runners ship
          # different ones: implementations differ on numeric-versus-string
          # typing and on record limits. `--version` is not portable — mawk
          # wants `-W version` — so try both.
          { awk --version 2>/dev/null || awk -W version 2>&1 \
            || echo "awk: version unknown"; } | head -1

          # One pass that reaches a verdict, rather than five numbers the shell
          # then re-validates. Deriving numbers needed a guard per number —
          # each could be empty, and an empty one makes `-ne` return 2, which
          # an `if` reads as "no problem". Here the comparisons happen where
          # the values live, and the plan is compared as digits rather than
          # through a shell integer.
          verdicts="$(printf '%s\n' "$out" | LC_ALL=C awk '
            # Concatenating "" forces both to strings. Without it the comparison
            # below depends on how the caller happened to produce them: a value
            # that arrived as a field compares as a double and ties past 2^53 —
            # measured, on the pair 99999999999999999991/…92.
            function numcmp(a, b,   la, lb) {
              a = a ""; b = b ""
              sub(/^0+/, "", a); if (a == "") a = "0"
              sub(/^0+/, "", b); if (b == "") b = "0"
              la = length(a); lb = length(b)
              if (la != lb) return (la < lb) ? -1 : 1
              return (a < b) ? -1 : ((a > b) ? 1 : 0)
            }
            # These two set state and consume nothing, so they run first: below a
            # rule ending in `next` they never see a line that rule took, and a
            # test whose name contains the sentinel text is exactly such a
            # line. That is what made this pass and the shell it replaces
            # disagree — exit 0 against exit 1.
            /bats warning: Executed/ { warned = 1 }
            /in test file [^,]*,/ {
              # match() is leftmost, so the occurrence extracted is the one the
              # pattern validated. A greedy sub() jumps to the LAST occurrence,
              # which may carry no comma — then the comma strip does nothing and
              # the rest of the line leaks into the annotation. Reachable from an
              # ordinary test name: bats echoes the name into the result line.
              # 13 is the length of `in test file `; the extra 1 drops the comma.
              match($0, /in test file [^,]*,/)
              suite = substr($0, RSTART + 13, RLENGTH - 14)
              if (!(suite in seen)) { seen[suite] = 1; order[++ns] = suite }
            }
            /^1\.\.[0-9]+$/  { plans++; if (plans == 1) planned = substr($0, 4); next }
            # `$2 != n`, not `$2 + 0 != n`: awk compares a field numerically only
            # when it looks like a number, so `ok 2x` string-compares and is
            # caught. Coercing with `+ 0` reads it as 2 and lets it through —
            # and a digit-prefixed ordinal arrives exactly one way, through
            # output a suite forged onto bats fd 3.
            /^ok [0-9]+/     { n++; if ($2 != n) misnumbered++; next }
            /^not ok [0-9]+/ { n++; failed++; if ($3 != n) misnumbered++; next }
            /^bin\/run-bats: [0-9]+ files$/ { if (files == "") files = $2; next }
            END {
              # Sorted, because the shell derivation this replaces piped the
              # names through `sort -u`. POSIX awk has no asort. This orders by
              # byte under LC_ALL=C where `sort -u` followed the locale of the
              # step, so mixed-case paths could list differently. Deliberate:
              # byte order is the same on every runner, and every `.bats` path
              # here is lowercase, where the two agree.
              if (failed + 0 != 0) {
                for (i = 2; i <= ns; i++) {
                  v = order[i]
                  for (j = i - 1; j >= 1 && order[j] > v; j--) order[j + 1] = order[j]
                  order[j + 1] = v
                }
                for (i = 1; i <= ns; i++) suites = suites (i == 1 ? "" : " ") order[i]
              }

              printf "COUNT %d\n", n + 0
              printf "FILES %s\n", (files == "" ? "-" : files)
              if (n + 0 == 0)
                print "::error::no test results in the output"
              if (plans + 0 != 1)
                printf "::error::expected one TAP plan, found %d\n", plans + 0
              # Kept only for parity with the shell this replaces, which needed
              # 18 because `[` could compare no wider. numcmp has no such
              # limit, so dropping this would report a 19-digit plan as
              # truncated rather than unusable.
              else if (length(planned) > 18)
                printf "::error::the TAP plan is not a usable number: %s\n", planned
              else if ((cmp = numcmp(planned, n "")) != 0) {
                if (cmp > 0)
                  printf "::error::truncated: planned %s, reported %d\n", planned, n + 0
                else
                  printf "::error::plan says %s but %d results were reported\n", planned, n + 0
              }
              if (failed + 0 != 0)
                printf "::error::%d failing test(s) in: %s\n", failed + 0,
                       (suites == "" ? "file not named" : suites)
              if (misnumbered + 0 != 0)
                printf "::error::%d result(s) are not numbered contiguously\n", misnumbered + 0
              if (warned)
                print "::error::bats reported executing a different number of tests than it planned"
              print "END"
            }
          ')"

          # Three facts and any faults. `END` is the load-bearing one: it is
          # printed last, so a verdict stream cut anywhere cannot pass.
          reported=""
          ran_files="-"
          saw_end=0
          while IFS= read -r line; do
            case "$line" in
              "COUNT "*) reported="${line#COUNT }" ;;
              "FILES "*) ran_files="${line#FILES }" ;;
              END) saw_end=1 ;;
              "::error::"*) printf '%s\n' "$line"; status=1 ;;
              '') ;;
              *) printf '::error::unexpected line from the verdict pass: %s\n' "$line"
                 status=1 ;;
            esac
          done <<< "$verdicts"

          # An awk that died leaves no COUNT, and every check above died with
          # it, so this is the one place the shell still has to be careful.
          # `END` last and required, so a stream cut anywhere after `COUNT`
          # cannot pass: every verdict the pass computes is printed between
          # them.
          case "$reported" in
            ''|*[!0-9]*) saw_end=0 ;;
          esac
          if [ "$saw_end" -ne 1 ]; then
            printf '::error::could not read the TAP stream (awk said: %s)\n' "$verdicts"
            exit 1
          fi

          # An independent `find`, because a run of the wrapper cannot check
          # the wrapper's own discovery: a suite it never looks for is silent,
          # and every count downstream of it stays consistent. A walk that died
          # partway must not be counted — the wrapper's discovery carries the
          # same predicates and degrades the same way, so the two counts would
          # agree on the undercount.
          if ! found="$(find . -type f -name '*.bats' \
               -not -path '*/.git/*' -not -path '*/node_modules/*')"; then
            printf '::error::the discovery walk failed, so its count proves nothing\n'
            status=1
          fi
          expected_files="$(printf '%s\n' "$found" | grep -c . || true)"
          # Compared as strings, so a wrapper that stops reporting the number
          # fails here loudly rather than disabling the check.
          if [ "$ran_files" != "$expected_files" ]; then
            printf '::error::the run covered %s files, this step found %s\n' \
              "$([ "$ran_files" = "-" ] && echo "<no count reported>" || echo "$ran_files")" \
              "$expected_files"
            status=1
          fi

          printf '\n%s tests reported from %s files\n' "$reported" "$expected_files"
          exit "$status"

  # `.github/workflows/` only. actionlint reads a composite action file as a
  # workflow and reports `"jobs" section is missing`, and the ShellCheck job's
  # file set is `*.sh`/`*.bash` — so the shell inside `.github/actions/` is
  # linted by nothing.
  actionlint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pinned release binary checked against its published checksum rather
      # than a third-party action. bats below is pinned too, but by tag and
      # without a checksum, so the shared property is only that neither is a
      # marketplace action. Renovate watches neither: its `github-actions`
      # manager reads `uses:`, not `env:`, and `.github/renovate.json` defines
      # no `customManagers` — so this pin ages until someone moves it
      # deliberately. The version and the checksum move together; bumping one
      # alone fails the step rather than installing something unverified.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          sudo install "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          # The checksum covers the tarball, not what the next step resolves.
          # An actionlint earlier on PATH would lint in its place, and a bare
          # `--version` reads as a check while asserting nothing.
          installed="$(actionlint --version | head -1)"
          if [ "$installed" != "$ACTIONLINT_VERSION" ]; then
            echo "actionlint on PATH is $installed, expected $ACTIONLINT_VERSION" >&2
            exit 1
          fi

      # actionlint shells out to shellcheck for `run:` blocks and skips them
      # silently when it cannot find it, so without this the job would pass
      # while checking far less than its name implies. The `run:` blocks are
      # most of what there is to get wrong in this file.
      - name: Verify shellcheck is present
        run: shellcheck --version

      # `-pyflakes=` rather than absent: pyflakes is skipped as silently as
      # shellcheck would be, and no `shell: python` block exists here, so
      # disabling it is a decision rather than a property of the runner image.
      #
      # The plain run decides the verdict and writes the log; the second pass
      # only adds annotations. `-format` replaces the caret diagram, and a
      # template that parses but fails mid-range emits some annotations and not
      # others — so running plain first keeps every finding in the log, and a
      # broken template costs presentation rather than evidence.
      #
      # No severity floor is available, so `run:` blocks are held to a stricter
      # bar than the ShellCheck job holds `*.sh` (`--severity=warning`): an
      # info-level finding fails the build. Deliberate — a gate is the wrong
      # place to be lenient. shellcheck's own version floats with the runner
      # image, unlike actionlint, pinned above to a version and a checksum.
      - name: Lint workflows
        env:
          # A template newline: actionlint 1.7.12 re-escapes the backslash in
          # `{{"\n"}}` and then rejects it. `{{println}}` works; YAML resolving
          # `\n` here reads better than either.
          ACTIONLINT_FORMAT: "{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}},col={{$e.Column}}::{{$e.Message}}\n{{end}}"
        run: |
          rc=0
          actionlint -pyflakes= || rc=$?
          # Only exit 1 means findings, so only exit 1 can yield annotations.
          # Leaving on anything else spares a second invocation that would
          # lint nothing and reprint the same diagnostic — measured on a
          # broken config: four occurrences before this gate, two after.
          [ "$rc" -eq 1 ] || exit "$rc"
          actionlint -pyflakes= -format "$ACTIONLINT_FORMAT" || true
          exit "$rc"

  # The single required check: the branch ruleset gates on this job alone, so
  # adding or renaming jobs never needs a ruleset edit. Every job above must be
  # listed in `needs` — an omitted job is invisible to the gate.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): a skipped required check counts as
    # satisfied, so cancellation must yield a red X here, not a skip.
    if: always()
    needs: [changes, bump-files, lint, validate, shellcheck, tests, actionlint]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Summarize results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Required |"
            echo "| --- | --- | --- |"
            echo "| Bump files | \`${{ needs.bump-files.result }}\` | Yes (PRs; skips on push) |"
            echo "| Markdown | \`${{ needs.lint.result }}\` | Yes |"
            echo "| Plugin manifests | \`${{ needs.validate.result }}\` | Yes |"
            echo "| ShellCheck | \`${{ needs.shellcheck.result }}\` | Yes (skips when no shell surface changed) |"
            echo "| Bats (both OSes) | \`${{ needs.tests.result }}\` | Yes (skips when no shell/test surface changed) |"
            echo "| Workflows | \`${{ needs.actionlint.result }}\` | Yes |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail_if_bad() {
            if [ "$2" = "failure" ] || [ "$2" = "cancelled" ]; then
              echo "Job '$1' failed or was cancelled"
              exit 1
            fi
          }

          fail_if_bad "changes" "${{ needs.changes.result }}"
          fail_if_bad "bump-files" "${{ needs.bump-files.result }}"
          fail_if_bad "lint" "${{ needs.lint.result }}"
          fail_if_bad "validate" "${{ needs.validate.result }}"
          fail_if_bad "shellcheck" "${{ needs.shellcheck.result }}"
          fail_if_bad "tests" "${{ needs.tests.result }}"
          fail_if_bad "actionlint" "${{ needs.actionlint.result }}"
